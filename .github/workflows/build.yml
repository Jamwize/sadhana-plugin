name: Build Mac installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal plug-in and installer
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sadhana-mac
          path: dist/
      - name: Publish installer to the 'installer' branch
        run: |
          git config user.name "Sadhana build"
          git config user.email "build@users.noreply.github.com"
          mkdir -p /tmp/out && cp -R dist/. /tmp/out/
          git checkout --orphan installer
          git rm -rf --quiet .
          cp -R /tmp/out/. .
          git add -A
          git commit -m "Installer from ${GITHUB_SHA::7}"
          git push -f origin installer
